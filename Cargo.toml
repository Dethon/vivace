[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# See vendor/README.md.
[patch."https://github.com/librespot-org/librespot"]
librespot-connect = { path = "vendor/librespot-connect" }
librespot-audio = { path = "vendor/librespot-audio" }
