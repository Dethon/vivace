[package]
name = "vivace-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1"
http-body-util = "0.1"
iana-time-zone = "0.1"
keyring = "4"
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9" }
log = "0.4"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
protobuf = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# librespot is pinned to a development commit: queue events and queue editing
# are not in a release yet.
#
# SChannel on Windows (no C toolchain needed to cross-compile), rustls elsewhere (no OpenSSL).
[target.'cfg(windows)'.dependencies]
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["native-tls"] }
librespot-oauth = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["native-tls"] }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["native-tls"] }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["native-tls"] }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["native-tls", "rodio-backend"] }

[target.'cfg(not(windows))'.dependencies]
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["rustls-tls-native-roots", "rodio-backend"] }

[dev-dependencies]
env_logger = "0.11"
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false }
memory-stats = "1"
