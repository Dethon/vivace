<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Vivace's icon. The icon example renders it into the PNG, the ICO and
       the installer panel. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="trail0" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="214" y2="0">
      <stop offset="0" stop-color="#1ed760" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#1ed760" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1ed760"/>
    </linearGradient>
    <linearGradient id="trail1" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="196" y2="0">
      <stop offset="0" stop-color="#1ed760" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#1ed760" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1ed760"/>
    </linearGradient>
    <linearGradient id="trail2" gradientUnits="userSpaceOnUse" x1="66" y1="0" x2="178" y2="0">
      <stop offset="0" stop-color="#1ed760" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#1ed760" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1ed760"/>
    </linearGradient>
    <clipPath id="crystal"><path d="M48 2L75 22L95 52L97 84L84 117L58 148L32 133L11 106L3 72L19 35z"/></clipPath>
    <!-- The crystal's outline: lit along its upper left, dark below. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f9de9"/>
      <stop offset="1" stop-color="#1d2176"/>
    </linearGradient>
    <!-- Light and shade laid over the facets so the whole stone reads as a
         rounded body rather than a flat pattern. -->
    <radialGradient id="glow" cx="0.36" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.84" cy="0.86" r="0.8">
      <stop offset="0" stop-color="#14176a" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#1c2080" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1c2080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- A near-black tile, as Spotify's apps are. -->
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>

  <!-- Three curved bars in Spotify's green, as if its sound waves were
       going by fast: each trails off to the left and leans forward. -->
  <g transform="translate(18 0) skewX(-14)" fill="none" stroke-width="24" stroke-linecap="round">
    <path d="M30 84Q122.0 52 214 84" stroke="url(#trail0)"/>
    <path d="M48 122Q122.0 90 196 122" stroke="url(#trail1)"/>
    <path d="M66 160Q122.0 128 178 160" stroke="url(#trail2)"/>
  </g>

  <!-- The gem shared with Folio's icon: an egg-shaped cut crystal, lit from
       the upper left, drawn in its own 100 x 150 box. -->
  <g transform="translate(178 151) scale(0.64)" stroke-linejoin="round">
    <path d="M48 2L75 22L95 52L97 84L84 117L58 148L32 133L11 106L3 72L19 35z" fill="#343a9e" stroke="url(#rim)" stroke-width="7"/>
    <g clip-path="url(#crystal)">
      <path d="M48 2L75 22L45 30z" fill="#e9eefd" stroke="#e9eefd" stroke-width="0.6"/>
      <path d="M48 2L45 30L19 35z" fill="#d3dcf8" stroke="#d3dcf8" stroke-width="0.6"/>
      <path d="M75 22L95 52L64 48z" fill="#8494e3" stroke="#8494e3" stroke-width="0.6"/>
      <path d="M75 22L64 48L45 30z" fill="#f7f9ff" stroke="#f7f9ff" stroke-width="0.6"/>
      <path d="M95 52L97 84L77 93z" fill="#5566cf" stroke="#5566cf" stroke-width="0.6"/>
      <path d="M95 52L77 93L64 48z" fill="#7889df" stroke="#7889df" stroke-width="0.6"/>
      <path d="M19 35L45 30L36 62z" fill="#c2cdf5" stroke="#c2cdf5" stroke-width="0.6"/>
      <path d="M19 35L36 62L3 72z" fill="#a3b2ee" stroke="#a3b2ee" stroke-width="0.6"/>
      <path d="M45 30L64 48L59 80L36 62z" fill="#ffffff" stroke="#ffffff" stroke-width="0.6"/>
      <path d="M64 48L77 93L59 80z" fill="#c9d4f7" stroke="#c9d4f7" stroke-width="0.6"/>
      <path d="M3 72L36 62L38 101z" fill="#c6d1f6" stroke="#c6d1f6" stroke-width="0.6"/>
      <path d="M3 72L38 101L11 106z" fill="#8b9be5" stroke="#8b9be5" stroke-width="0.6"/>
      <path d="M36 62L59 80L38 101z" fill="#f3f6ff" stroke="#f3f6ff" stroke-width="0.6"/>
      <path d="M59 80L56 121L38 101z" fill="#e4eafc" stroke="#e4eafc" stroke-width="0.6"/>
      <path d="M59 80L77 93L56 121z" fill="#6f80da" stroke="#6f80da" stroke-width="0.6"/>
      <path d="M97 84L84 117L77 93z" fill="#3f4bb8" stroke="#3f4bb8" stroke-width="0.6"/>
      <path d="M84 117L56 121L77 93z" fill="#4b59c4" stroke="#4b59c4" stroke-width="0.6"/>
      <path d="M84 117L58 148L56 121z" fill="#2c349f" stroke="#2c349f" stroke-width="0.6"/>
      <path d="M58 148L32 133L56 121z" fill="#5564cc" stroke="#5564cc" stroke-width="0.6"/>
      <path d="M32 133L38 101L56 121z" fill="#aebbf0" stroke="#aebbf0" stroke-width="0.6"/>
      <path d="M32 133L11 106L38 101z" fill="#7485dd" stroke="#7485dd" stroke-width="0.6"/>
      <rect width="100" height="150" fill="url(#shade)"/>
      <rect width="100" height="150" fill="url(#glow)"/>
      <!-- The ridges where facets meet catch the light. -->
      <path d="M48 2L45 30 M45 30L64 48 M45 30L36 62 M36 62L59 80 M64 48L59 80 M59 80L38 101 M59 80L56 121 M36 62L38 101" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round"/>
      <!-- A streak of reflection down the lit flank. -->
      <path d="M17 52l8-9 4 30-7 8z" fill="#fff" fill-opacity="0.55"/>
    </g>
  </g>
</svg>
