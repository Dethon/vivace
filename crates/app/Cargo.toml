[package]
name = "vivace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vivace-core = { path = "../core" }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Software renderer only: GPU renderers cost 80-240 MB of driver memory.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"

[dev-dependencies]
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false }
memory-stats = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.18"
