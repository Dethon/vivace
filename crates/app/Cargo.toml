[package]
name = "vivace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vivace-core = { path = "../core" }
log = { version = "0.4", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Software renderer only: GPU renderers cost 80-240 MB of driver memory.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
# Already built for librespot's sign-in; opens links in the browser.
open = "5"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already built for the media keys' MPRIS service.
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(not(windows))'.dependencies]
dirs = "6"

[dev-dependencies]
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false }
memory-stats = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
# Renders assets/icon.svg in the icon example.
resvg = { version = "0.45", default-features = false }

[build-dependencies]
slint-build = "1.18"
